/* ---------- RETURNS LIST ---------- */
const RTAB = { t: 'today' };
function scrReturns(r) {
  if (r.q.tab) RTAB.t = r.q.tab;
  const d = dayData(), t0 = sod(NOW);
  const upcoming = DB.bookings.filter(b => b.status === 'picked' && b.returnBy >= addDays(t0, 1)).sort((a, b) => a.returnBy - b.returnBy);
  const out = DB.bookings.filter(b => b.status === 'picked').sort((a, b) => a.returnBy - b.returnBy);
  const tabs = [['today', 'Due today', d.dueAll.length], ['overdue', 'Overdue', d.overdue.length], ['inspection', 'Awaiting inspection', d.inspect.length], ['upcoming', 'Upcoming', upcoming.length], ['out', 'All out', out.length]];
  let body = '';
  if (RTAB.t === 'today') body = [...d.overdue.filter(b => sameDay(b.returnBy, NOW)).map(b => dueRow(b, 'over')), ...d.dueWaiting.map(b => dueRow(b, 'due')), ...d.dueDone.map(b => dueRow(b, 'done'))].join('') || emptyState('No returns due today');
  if (RTAB.t === 'overdue') body = d.overdue.map(b => dueRow(b, 'over')).join('') || emptyState('No overdue returns 🎉');
  if (RTAB.t === 'inspection') body = d.inspect.map(b => dueRow(b, 'done')).join('') || emptyState('Nothing waiting for inspection');
  if (RTAB.t === 'upcoming') body = upcoming.map(b => dueRow(b, 'due')).join('') || emptyState('Nothing else out');
  if (RTAB.t === 'out') body = out.map(b => dueRow(b, isOverdue(b) ? 'over' : 'due')).join('') || emptyState('Nothing out');
  return {
    t: 'Returns', s: `Deadline before ${fHHMM(S().returnDeadline)}`, html: `
    <div class="pagehead"><div class="grow"><h1 class="pg">Returns</h1><p>Return deadline: <b>before ${fHHMM(S().returnDeadline)}</b> on the return date. ${esc(lateRuleText())}.</p></div><button class="btn btn-primary btn-lg" onclick="callListModal()">${ic('phone', 18)} Call Returns Today</button></div>
    <div class="tabs">${tabs.map(([k, l, n]) => `<button class="${RTAB.t === k ? 'on' : ''}" onclick="RTAB.t='${k}';render()">${l} <span class="badge ${k === 'overdue' && n ? 'red' : ''}" style="margin-left:4px">${n}</span></button>`).join('')}</div>
    <div class="card ${RTAB.t === 'overdue' && d.overdue.length ? 'hl-danger' : ''}">${body}</div>` };
}

/* ---------- CALENDAR ---------- */
const CAL = { y: 2026, m: 8, sel: null };
function scrCalendar() {
  tourMark('cal');
  if (!CAL.sel) CAL.sel = isoDay(NOW);
  const first = new Date(CAL.y, CAL.m, 1), dim = new Date(CAL.y, CAL.m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, weeks = Math.ceil((lead + dim) / 7), start = addDays(first, -lead);
  const live = DB.bookings.filter(b => !['cancelled', 'void'].includes(b.status));
  const on = (d, k) => live.filter(b => sameDay(b[k], d));
  const cells = [...Array(weeks * 7)].map((_, i) => {
    const d = addDays(start, i), p = on(d, 'pickupAt').length, e = on(d, 'eventDate').length, r = on(d, 'returnBy').length;
    return `<button class="day ${d.getMonth() !== CAL.m ? 'out' : ''} ${sameDay(d, NOW) ? 'today' : ''} ${isoDay(d) === CAL.sel ? 'sel' : ''}" onclick="CAL.sel='${isoDay(d)}';render()"><span class="n">${d.getDate()}</span>${festivalNightOf(d) ? `<span class="tiny" style="color:var(--accent-2);font-weight:800">✦<span class="lbl2"> Night</span> ${festivalNightOf(d)}</span>` : ''}
      ${p ? `<span class="ev p">↑ ${p}<span class="lbl2"> pickup</span></span>` : ''}${e ? `<span class="ev e">★ ${e}<span class="lbl2"> event</span></span>` : ''}${r ? `<span class="ev r">↓ ${r}<span class="lbl2"> return</span></span>` : ''}</button>`;
  }).join('');
  const sd = parseIso(CAL.sel);
  const grp = (k, label, cls) => { const bs = on(sd, k); return `<div class="card"><div class="card-h"><span class="pill ${cls}">${label}</span><span class="grow"></span><b>${bs.length}</b></div><div class="list mini-list">${bs.map(b => `<div class="lrow click" onclick="go('#/booking/${b.no}')"><div class="grow"><b>${esc(cust(b.customerId).name)}</b> <span class="tiny muted">${b.no}</span><div class="itemchips" style="margin-top:4px">${codeChips(b)}</div></div>${bpill(b)}</div>`).join('') || '<div class="empty small">None</div>'}</div></div>`; };
  return {
    t: 'Calendar', s: `${MONTHS_L[CAL.m]} ${CAL.y}`, html: `
    <div class="pagehead"><div class="grow"><h1 class="pg">Rental calendar</h1><p>Pickups, Garba nights and returns. Tap a day to see its bookings.</p></div>
      <div class="row"><button class="btn icon-btn" onclick="CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--};render()" aria-label="Previous month">${ic('left')}</button><b style="min-width:150px;text-align:center;font-size:17px">${MONTHS_L[CAL.m]} ${CAL.y}</b><button class="btn icon-btn" onclick="CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++};render()" aria-label="Next month">${ic('right')}</button><button class="btn" onclick="CAL.y=NOW.getFullYear();CAL.m=NOW.getMonth();CAL.sel=isoDay(NOW);render()">Today</button></div></div>
    <div class="split"><div class="card pad"><div class="legend" style="margin-bottom:12px"><span><i style="background:var(--info)"></i>↑ Pickups (2–3 PM)</span><span><i style="background:var(--accent)"></i>★ Event nights</span><span><i style="background:var(--good)"></i>↓ Returns (before 12 PM)</span></div>
      <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div></div>
      <div class="stack s16"><h3 style="font-family:var(--display);font-size:20px">${fDate(sd)}</h3>${grp('pickupAt', 'Pickups', 'st-reserved')}${grp('eventDate', 'Event night', 'st-inspection')}${grp('returnBy', 'Returns due', 'st-available')}</div></div>` };
}

/* ---------- SALES ---------- */
function lockView(what) {
  return { t: 'Restricted', html: `<div class="card lock"><div class="ic">${ic('lock', 30)}</div><h3 style="font-size:20px">${what} is restricted</h3><p class="muted">Your role (<b>${ROLE_LABEL[CUR.role]}</b>) doesn’t have access. This keeps financial data, prices and settings safe.</p>${LIVE ? '<p class="small">Ask the owner or a manager.</p>' : `<button class="btn btn-lg" onclick="switchUser('u1')">Switch to Admin (demo)</button>`}</div>` };
}
function saleBlock(it) {

  const bs = bookingsFor(it.code).filter(b => ['reserved', 'picked', 'returned_pending'].includes(b.status));
  if (bs.length) return `Has ${bs.length} open booking${bs.length > 1 ? 's' : ''} (${bs.map(b => `${b.no}, ${fDateS(b.pickupAt)}`).join('; ')}). Sell after return, or swap the booking to another piece first.`;

let SALE = null;

function saleCustRes() { const el = $('#scres'); if (!el) return; const q = SALE.cq.trim(); el.innerHTML = q ? `<div class="card"><div class="list">${custMatch(q).slice(0, 5).map(c => `<div class="lrow click" onclick="SALE.customerId='${c.id}';render()"><div class="avatar">${initials(c.name)}</div><div class="who2 grow"><b>${esc(c.name)}</b><span>${fMob(c.mobile)}</span></div></div>`).join('') || emptyState('No match')}</div></div>` : ''; }
function saleConfirm() {
  const it = item(SALE.code), bl = saleBlock(it); if (bl) return toast(bl, 'bad');
  const v = SALE.voucher ? checkVoucher(SALE.voucher, { amount: SALE.price, kind: 'sale' }) : null, disc = v && v.ok ? v.discount : 0;

function scrSaleView(id) {

const REP = { tab: 'revenue', range: 'season' };
function repRange() {

function itemPerf(it) {

  const rev = it.prev.revenue + sum(bs, b => b.lines.find(l => l.code === it.code).alloc) + sum(bs, b => b.returnInfo && b.returnInfo.lines[it.code] ? +b.returnInfo.lines[it.code].charge : 0);
  const saleRev = sum(DB.sales.filter(s => s.code === it.code && !s.voided), s => s.price);
  const net = rev + saleRev - it.repairCost;

}

    return { tiles: [['Returns', bs.length], ['On time', bs.length ? Math.round((bs.length - late) / bs.length * 100) + '%' : '—'], ['Late fees', rs(sum(bs, b => b.returnInfo.lateFee))], ['Damage charged', rs(sum(bs, b => money(b).damage))]], cols: ['Booking', 'Customer', 'Due', 'Returned', 'Late (min)', '₹Late fee', '₹Damage', '₹Refund', 'Refund mode'], rows: bs.map(b => [b.no, cust(b.customerId).name, fDT(b.returnBy), fDT(b.returnInfo.receivedAt), Math.max(0, b.returnInfo.lateMins), b.returnInfo.lateFee, money(b).damage, b.returnInfo.refund, b.returnInfo.refundMode || '—']) };
  }
  if (REP.tab === 'sales') {

    return { tiles: [['Items sold', ss.length], ['Sales revenue', rs(sum(ss, s => s.price))], ['Discounts', rs(sum(ss, s => s.discount))], ['Avg. sale', rs(ss.length ? sum(ss, s => s.price) / ss.length : 0)]], cols: ['Sale', 'Date', 'Item', 'Customer', 'Mode', '₹Amount'], rows: ss.map(s => [s.id, fDT(s.at), `${s.code} ${item(s.code).name}`, s.customerId ? cust(s.customerId).name : 'Walk-in', s.mode, s.price]) };
  }

    rows.sort((x, y) => x.p.at - y.p.at);
    const tot = k => sum(rows.filter(r => k.includes(r.p.kind)), r => r.p.amount);
    const held = sum(DB.bookings.filter(b => ['reserved', 'picked', 'returned_pending'].includes(b.status)), b => money(b).held);
    return { tiles: [['Collected', rs(tot(['deposit', 'topup']))], ['Refunded', rs(tot(['refund']))], ['Retained (fees/damage)', rs(tot(['damage', 'late']))], ['Held right now (liability)', rs(held)]], cols: ['Date', 'Booking', 'Customer', 'Entry', 'Mode', '₹In', '₹Out'], rows: rows.map(({ p, b }) => [fDT(p.at), b.no, cust(b.customerId).name, KIND[p.kind], p.mode, ['deposit', 'topup'].includes(p.kind) ? p.amount : '', ['deposit', 'topup'].includes(p.kind) ? '' : p.amount]) };
  }

  }
  const rows = DB.items.map(it => ({ it, p: itemPerf(it) })).sort((x, y) => y.p.roi - x.p.roi);
  const top = rows[0], zero = rows.filter(r => r.p.rentals === 0 && r.it.mode !== 'sale').length;

}

/* ---------- DEVELOPER HANDOFF ---------- */
function scrHandoff() {
  return {
    t: 'Developer Handoff', s: 'Build notes', html: `<div class="pagehead"><div class="grow"><div class="eyebrow">For the development team</div><h1 class="pg">Developer handoff</h1><p>How to turn this prototype into the production app. The prototype is the UX reference; these are the rules behind it.</p></div></div>
    <div class="grid g2 doc">
    <div class="card pad"><h3>1 · What this file is</h3><ul><li>A clickable UX prototype. Single HTML file, vanilla JS, no dependencies.</li><li>All data is <b>in-memory sample data</b> — it resets on reload. There is <b>no</b> server, cloud or persistence here.</li><li>The demo clock (top bar) exists only to show time-based behaviour (returns due, overdue).</li><li>Code is organised by section: utilities → seed data → domain logic → roles → screens → router. Domain functions (<code>availability</code>, <code>quote</code>, <code>checkVoucher</code>, <code>lateFee</code>, <code>completeCore</code>) are the business rules to port to the server.</li></ul></div>
    <div class="card pad"><h3>2 · Recommended stack</h3><ul><li><b>Frontend:</b> React + Next.js (TypeScript), installable PWA for the shop tablet. Each screen here maps to a route/component.</li><li><b>Backend:</b> Node.js (NestJS or Next.js API routes) — all rules enforced server-side.</li><li><b>Database:</b> managed PostgreSQL (e.g. Supabase, AWS RDS, Neon) in an India region.</li><li><b>Files:</b> item & damage photos in S3-compatible storage.</li><li><b>Messaging:</b> WhatsApp Business API (templates for confirm / reminder / overdue / refund).</li><li><b>Payments:</b> record UPI reference; later optional UPI QR / payment-gateway integration.</li></ul></div>
    <div class="card pad" style="grid-column:1/-1"><h3>3 · Core data model</h3><pre><code>collections   id, name, status(active|planned)             -- Garba, Wedding, Bridal, Party
items         id, code UNIQUE (G021), type(G|C|D|J|…), collection_id, colour, size, style,
              purchase_cost, rent_price, sale_price, deposit, mode(rent|sale|both),
              condition, physical_status(in|out|inspection|repair|sold|lost), notes, created_at
item_photos   id, item_id, url, kind(front|back|detail|damage)
item_events   id, item_id, at, user_id, type, text                 -- append-only history
packages      id, name, price, active                              -- Garba Glam ₹1,499
package_slots package_id, item_type, qty                           -- G×1, C×1, D×1, J×1
customers     id (CU-1001), name, mobile UNIQUE, whatsapp, email, address, notes, salon_customer_id
bookings      id, number (OMG-00131), customer_id, pickup_at, event_date, return_by,
              rent_gross, discount, voucher_id, deposit_due, status, notes, created_by, created_at
booking_items booking_id, item_id, package_ref, list_price, allocated_price, deposit,
              blocked tstzrange, active bool                      -- ← double-booking guard
payments      id, booking_id|sale_id, kind(rent|deposit|topup|refund|damage|late|rent_refund|sale),
              amount, mode(Cash|UPI|Card|Bank|Deposit deduction), reference, at, user_id  -- append-only
returns       booking_id, received_at, inspected_at, late_minutes, late_fee, waived_by, refund, refund_mode
return_items  booking_id, item_id, condition, charge, note, photo_url
sales         id, item_id, customer_id NULL, list_price, discount, voucher_id, price, mode, at, user_id, voided
vouchers      id, code UNIQUE, issuer(rental|salon), type(fixed|percent), value, max_off, min_amount,
              valid_from, valid_to, usage_limit, per_customer, collection_id NULL,
              applies_rental, applies_sale, applies_salon, status(active|disabled)
voucher_uses  voucher_id, customer_id, booking_id|sale_id|salon_ref, amount, at
users         id, name, email, role(admin|manager|staff), pin_hash, twofa, active
audit_log     id, at, user_id, action, entity, entity_id, before JSONB, after JSONB, ip, device  -- append-only
settings      key, value JSONB, updated_by, updated_at                   -- timings, late-fee rule…</code></pre></div>
    <div class="card pad"><h3>4 · Preventing double booking</h3><p>Availability is <b>calculated from bookings</b>, never from a status flag. Each booked piece blocks <code>[pickup_at, return_by + buffer)</code>. If the piece is overdue, the block extends until it is actually returned. Enforce it in the database so it holds even with two tablets booking at once:</p>
<pre><code>CREATE EXTENSION IF NOT EXISTS btree_gist;
ALTER TABLE booking_items ADD CONSTRAINT no_double_booking
  EXCLUDE USING gist (item_id WITH =, blocked WITH &&)
  WHERE (active);</code></pre><p>Create booking = one transaction: validate → insert booking + booking_items + payments → commit. If the constraint fires, return “G021 was just booked — please swap”. Cancel/void sets <code>active=false</code>.</p></div>
    <div class="card pad"><h3>5 · Status machines</h3><p><b>Booking:</b> reserved → picked (handover) → returned_pending (optional) → closed. reserved → cancelled. any → void (manager, reason required).</p><p><b>Item physical status:</b> in → out → inspection → in | repair | lost; in → repair → in; in → sold. “Reserved” and “Rented” shown in the UI are <i>derived</i> from bookings.</p><p><b>Return outcome per piece:</b> Good / Minor → Available · Stained / Repair required / Major → Repair · Missing → Lost.</p></div>
    <div class="card pad"><h3>6 · Money rules</h3><ul><li>Deposit = sum of item deposits (min from settings). It is a <b>liability</b>, not revenue.</li><li>Payments apply to rent first, then deposit.</li><li>Refund = deposit held − damage − late fee − unpaid rent. If negative, collect the difference.</li><li>Package & voucher revenue is allocated to pieces pro-rata to list price (for item ROI).</li><li>Late fee = settings rule (type, amount, grace, per-day, cap). Waiving needs <code>fee.waive</code>.</li><li>Prices are copied onto the booking at creation — later price edits don’t change old bookings.</li><li>Money in integer paise on the server.</li></ul></div>
    <div class="card pad"><h3>7 · API sketch</h3><pre><code>GET  /availability?items=G021,C043&from=…&to=…
POST /bookings                    {customer, lines, packages, dates, voucher, payment}
POST /bookings/:id/handover       {payment?, id_checked}
POST /bookings/:id/receive        -- quick receive, inspect later
POST /bookings/:id/return         {items:[{item,condition,charge,note}], waive?, refund_mode}
POST /bookings/:id/cancel|void    {reason}
POST /bookings/:id/payments       {amount, mode, reference}
POST /sales                       {item, customer?, voucher?, mode}
POST /vouchers/validate           {code, amount, kind, customer}   -- also used by OMG Salon
GET  /dashboard/today             -- due, overdue, pickups, pending, inspection
GET  /reports/:type?from&to&format=csv</code></pre></div>
    <div class="card pad"><h3>8 · Non-negotiables</h3><ul><li>Server-side permission checks on every endpoint.</li><li>No DELETE for bookings, payments, sales, customers, audit.</li><li>Idempotency key on every payment request (no double charges on a flaky network).</li><li>Server time (IST) is the only clock — never trust the device clock for late fees.</li><li>Nightly job: mark overdue, send WhatsApp reminders at 10 AM on return day.</li><li>Automatic backups + tested restore.</li></ul></div>
    <div class="card pad"><h3>9 · Edge cases to handle</h3><ul><li>Customer wants a different size at pickup → swap item on the booking (re-check availability).</li><li>Extend rental → move return date, re-check conflicts, charge extra day.</li><li>Partial return (dupatta comes tomorrow) → item-level return; booking stays open.</li><li>No-show at pickup → auto-flag after pickup window; release items after X hours.</li><li>Item damaged beyond deposit → collect difference; mark outstanding if unpaid.</li><li>Selling a piece with future bookings → blocked (see G021).</li><li>Network drop mid-booking → idempotent retry; never half-saved.</li></ul></div>

function pinKey(k) {

async function doLogin() {
  if (LOGIN.pin.length < 4) { LOGIN.err = 'PIN is 4–6 digits'; return renderLogin(); }

    const today0 = new Date();
    const items = Object.keys(map).map(c => ({ ...base.items.find(x => x.code === c), code: map[c], prev: { rentals: 0, revenue: 0 }, repairCost: 0, status: 'in', log: [], addedOn: fDateS(today0) + ' ' + today0.getFullYear() }));
    DB = { ...base, items, customers: base.customers.slice(0, 5), vouchers: base.vouchers.filter(v => v.code !== 'EARLYBIRD'), sales: [], bookings: [], audit: [], seq: { booking: 100, sale: 500, customer: 1005 } };
    DB.imap = Object.fromEntries(items.map(i => [i.code, i]));
    NOW = new Date();
    const today = sod(NOW), by = (CUR && CUR.name) || 'Shop Owner';
    const mk = (cid, codes, evOffset, pkgKey) => {
      const d = datesForEvent(addDays(today, evOffset)), p = pkgKey ? DB.packages.find(x => x.key === pkgKey) : null;
      const b = makeBooking({ customerId: cid, lines: codes.map(c => ({ code: c, pkg: p ? 0 : null })), pkgs: p ? [{ key: p.key, name: p.name, price: p.price }] : [], ...d, createdAt: addDays(d.pickupAt, -3), by });
      recordPayment(b, money(b).rentNet + b.depositDue, 'UPI', b.createdAt, by); DB.bookings.push(b); return b;
    };
    const b1 = mk('CU-1003', ['G001', 'C001', 'J001'], -6);            // returned & closed, with a damage charge
    handoverCore(b1, addMin(b1.pickupAt, 20), by, 0, 'UPI');
    completeCore(b1, { at: addMin(b1.returnBy, -60), by, lines: { G001: { cond: 'good', charge: 0 }, C001: { cond: 'minor', charge: 300, note: 'Hook loose' }, J001: { cond: 'good', charge: 0 } }, lateFeeAmt: 0, lateMins: 0, refundMode: 'UPI' });

  } finally { DB = live; NOW = liveNow; }

/* ---------- Photos: compress in the browser → Apps Script → GitHub (raw URL saved in Item_Photos) ---------- */
const photoRow = p => ({ photo_id: p.id, item_code: p.kind === 'id' ? '' : p.code, customer_id: p.kind === 'id' ? p.code : '', booking_no: p.booking || '', kind: p.kind, url: p.url, path: p.path || '', size_kb: p.sizeKb || 0, uploaded_at: iso(p.at), uploaded_by: p.by || '', active: p.active === false ? 'no' : 'yes' });
const photoFromRow = r => ({ id: r.photo_id, code: r.kind === 'id' ? r.customer_id : r.item_code, booking: r.booking_no || '', kind: r.kind || 'item', url: r.url, path: r.path || '', sizeKb: num(r.size_kb), at: pd(r.uploaded_at), by: r.uploaded_by || '', active: String(r.active).toLowerCase() !== 'no' });
async function compressImage(file, maxSide = 1280, maxKB = 280) {
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That file is not an image')); i.src = src; });
    const sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    let q = 0.8, blob;
    do { blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q)); q -= 0.1; } while (blob && blob.size > maxKB * 1024 && q > 0.35);
    if (!blob) throw new Error('Could not compress the photo');
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
    return { blob, b64, kb: Math.round(blob.size / 1024), w: c.width, h: c.height, origKB: Math.round(file.size / 1024) };
  } finally { URL.revokeObjectURL(src); }
}
async function addPhotos(input, code, kind = 'item', bookingNo = '') {
  const files = [...(input.files || [])]; input.value = '';
  if (!files.length) return;
  if (LIVE && !PHOTOS_ON) return toast('Photo storage is not set up yet (Settings → Connection)', 'bad');
  let done = 0, saved = 0;
  for (const f of files) {
    toast(`Compressing & uploading photo ${++done} of ${files.length}…`);
    try {
      const c = await compressImage(f);
      if (!LIVE) { DB.photos.push({ id: uid('PH-'), code, booking: bookingNo, kind, url: URL.createObjectURL(c.blob), sizeKb: c.kb, at: new Date(NOW), by: CUR.name, active: true, local: true }); saved++; continue; }
      const r = await api('uploadPhoto', kind === 'id' ? { customer_id: code, kind, data: c.b64 } : { item_code: code, kind, booking_no: bookingNo, data: c.b64 });
      if (!r.ok) { toast(r.error || 'Upload failed', 'bad'); break; }
      const p = photoFromRow(r.photo); DB.photos.push(p);
      SYNCED.Item_Photos = SYNCED.Item_Photos || {}; SYNCED.Item_Photos[p.id] = JSON.stringify(photoRow(p));
      saved++;
    } catch (e) { toast('Upload failed: ' + (e.message || 'check internet'), 'bad'); break; }
  }
  if (saved) { audit('Photo added', code, `${saved} ${kind} photo(s)${bookingNo ? ' · ' + bookingNo : ''}`); render(); toast(LIVE ? `${saved} ${kind === 'id' ? 'ID ' : ''}photo(s) saved to GitHub` : 'Demo mode: photo shown but not saved', 'good'); }
}
function photosFor(code, kind, bookingNo) { return (DB.photos || []).filter(p => p.code === code && p.active !== false && (!kind || p.kind === kind) && (bookingNo == null || p.booking === bookingNo)); }

}
const pubHex = it => /^#[0-9a-f]{6}$/i.test(it.hex) ? it.hex : (COLOURS[it.colour] || '#b04a8a');
const pubType = it => (TYPES[it.type] || { name: it.type }).name;
const PUB_MODE = { rent: 'On rent', both: 'On rent · also for sale', sale: 'For sale' };
function pubTop() {
  return `<div class="ptop"><a href="#/catalog" class="row" style="gap:10px"><div class="logo" style="width:42px;height:42px;font-size:13px">OMG</div><div><b>${esc(PUB.shop.name || 'OMG Rental')}</b><div class="tiny muted">${esc(PUB.shop.city || '')}${PUB.shop.city ? ' · ' : ''}Catalogue</div></div></a><span class="grow"></span><button class="btn btn-sm" onclick="go('#/dashboard')">${ic('lock', 16)} Staff login</button></div>`;
}
/* Can this piece be rented for an event on this day? (pickup that day, return next day) */
function pubFree(code, day) {
  const it = PUB.items.find(i => i.code === code);
  if (!it || it.status === 'repair' || it.mode === 'sale') return false;
  const d = datesForEvent(day), st = d.pickupAt.getTime(), end = d.returnBy.getTime() + (+S().bufferHours || 0) * 3600e3;
  return !(PUB.blocks[code] || []).some(([f, u]) => new Date(f).getTime() < end && st < new Date(u).getTime());
}
function pubCard(it) {
  const ph = (PUB.photos[it.code] || [])[0], day = PUBQ.date ? parseIso(PUBQ.date) : null;
  const badge = day ? (pubFree(it.code, day) ? '<span class="pill st-available">Available</span>' : '<span class="pill st-lost">Booked</span>') : '';
  return `<a class="pcard" href="#/item/${it.code}"><div class="im" style="${tileBg(pubHex(it))}">${ph ? `<img src="${esc(ph)}" alt="" loading="lazy">` : art(it.type, pubHex(it), 110)}${badge}</div>
    <div class="b"><div class="nm">${esc(it.name)}</div><div class="tiny muted" style="margin-top:3px"><span class="mono">${it.code}</span> · ${esc(it.size)}</div></div></a>`;
}
function pubList() {
  const day = PUBQ.date ? parseIso(PUBQ.date) : null, q = PUBQ.q.trim().toLowerCase();
  let list = PUB.items.slice();
  const types = Object.keys(TYPES).filter(k => list.some(i => i.type === k));
  if (PUBQ.type !== 'all') list = list.filter(i => i.type === PUBQ.type);
  if (q) list = list.filter(i => [i.code, i.name, i.colour, i.style, i.size, pubType(i)].join(' ').toLowerCase().includes(q));
  if (day) list = list.filter(i => pubFree(i.code, day));
  const nights = festivalNights().filter(f => f.d >= sod(new Date()));
  return `<div class="stack s16">
    <div><h1 class="pg">Our collection</h1><p class="muted" style="margin:4px 0 0">Tap any piece to see photos and the dates it is free. Visit the shop to book.</p></div>
    <div class="row wrap" style="gap:8px"><div class="input-wrap grow" style="min-width:200px"><span class="pre">${ic('search', 18)}</span><input class="input" style="padding-left:42px" placeholder="Search colour, style, code…" value="${esc(PUBQ.q)}" onchange="PUBQ.q=this.value;renderPublic()"></div>
      <label class="row" style="gap:6px"><span class="small muted">Free on</span><input class="input" type="date" style="width:auto" value="${PUBQ.date}" onchange="PUBQ.date=this.value;renderPublic()"></label>${PUBQ.date ? `<button class="btn btn-sm" onclick="PUBQ.date='';renderPublic()">${ic('x', 14)} Clear date</button>` : ''}</div>
    ${nights.length ? `<div class="chips scroll">${nights.map(f => { const v = isoDay(f.d); return `<button class="chip ${PUBQ.date === v ? 'on' : ''}" onclick="PUBQ.date='${v}';renderPublic()">Night ${f.n} · ${fDateS(f.d)}</button>`; }).join('')}</div>` : ''}
    <div class="chips scroll">${[['all', 'All'], ...types.map(k => [k, TYPES[k].short])].map(([k, l]) => `<button class="chip ${PUBQ.type === k ? 'on' : ''}" onclick="PUBQ.type='${k}';renderPublic()">${l}</button>`).join('')}</div>
    <div class="small muted">${list.length} piece${list.length === 1 ? '' : 's'}${day ? ' free for an event on ' + fDate(day) : ''}</div>
    ${list.length ? `<div class="pcards">${list.map(pubCard).join('')}</div>` : emptyState('Nothing found', 'Try another colour, type or date.')}</div>`;
}
function pubCal(code) {
  const today = sod(new Date()), cur = new Date(today.getFullYear(), today.getMonth(), 1);
  const m0 = PUBQ.month || cur, y = m0.getFullYear(), mo = m0.getMonth(), days = new Date(y, mo + 1, 0).getDate();
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7, canPrev = m0 > cur, canNext = (y - cur.getFullYear()) * 12 + mo - cur.getMonth() < 11;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const day = new Date(y, mo, d), past = day < today, free = !past && pubFree(code, day), fest = festivalNightOf(day);
    cells += `<div class="d ${past ? 'past' : free ? 'free' : 'busy'}${fest ? ' fest' : ''}" title="${fDate(day)}${fest ? ' · Navratri night ' + fest : ''}: ${past ? 'past' : free ? 'available' : 'booked'}">${d}</div>`;
  }
  return `<div class="row between" style="margin-bottom:10px"><button class="btn btn-sm" ${canPrev ? '' : 'disabled'} onclick="PUBQ.month=new Date(${y},${mo - 1},1);renderPublic()" aria-label="Previous month">${ic('left', 16)}</button>
      <b>${m0.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</b>
      <button class="btn btn-sm" ${canNext ? '' : 'disabled'} onclick="PUBQ.month=new Date(${y},${mo + 1},1);renderPublic()" aria-label="Next month">${ic('right', 16)}</button></div>
    <div class="pcal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="h">${d}</div>`).join('')}${cells}</div>
    <div class="plegend"><span><i style="background:var(--good-soft);border:1px solid var(--good)"></i>Available</span><span><i style="background:var(--danger-soft);border:1px solid var(--danger)"></i>Booked</span>${festivalNights().length ? `<span><i style="background:var(--brand);width:7px;height:7px;border-radius:50%"></i>${esc(S().festivalName || 'Festival')} night</span>` : ''}</div>`;
}
function pubItem(code) {
  const it = PUB.items.find(i => i.code === code);
  if (!it) return `<div class="card pad stack" style="text-align:center;max-width:460px;margin:0 auto"><h3>Piece ${esc(code)} is not in the catalogue</h3><p class="muted" style="margin:0">It may have been sold or taken out of the collection.</p><a class="btn btn-primary btn-lg" href="#/catalog">See the full collection</a></div>`;
  if (PUBQ.code !== code) { PUBQ.code = code; PUBQ.ph = 0; PUBQ.month = null; }
  const ps = PUB.photos[code] || [], hex = pubHex(it), ph = Math.min(PUBQ.ph, Math.max(0, ps.length - 1));
  const nights = festivalNights().filter(f => f.d >= sod(new Date()));
  const row = (k, v) => v ? `<div class="line"><span class="muted">${k}</span><b style="text-align:right">${v}</b></div>` : '';
  const status = it.status === 'repair' ? '<span class="pill st-repair">Not available right now</span>' : it.mode === 'sale' ? '<span class="pill">For sale</span>' : pubFree(code, defaultEvent()) ? '<span class="pill st-available">Available today</span>' : '<span class="pill st-lost">Booked today</span>';
  return `<div class="row" style="margin-bottom:12px"><a class="btn btn-ghost btn-sm" href="#/catalog">${ic('left', 16)} Full collection</a></div>
  <div class="pitem">
    <div class="pgal"><div class="main" style="${tileBg(hex)}">${ps.length ? `<img src="${esc(ps[ph])}" alt="${esc(it.name)}">` : art(it.type, hex, 240)}</div>
      ${ps.length > 1 ? `<div class="ths">${ps.map((u, i) => `<img src="${esc(u)}" alt="" class="${i === ph ? 'on' : ''}" onclick="PUBQ.ph=${i};renderPublic()">`).join('')}</div>` : ''}</div>
    <div class="stack s16">
      <div><div class="row wrap" style="gap:6px">${status}<span class="pill"><span class="mono">${it.code}</span></span></div>
        <h1 class="pg" style="font-size:26px;margin-top:10px">${esc(it.name)}</h1><div class="muted small" style="margin-top:4px">${esc(pubType(it))}</div></div>
      <div class="card pad summary"><h3 style="margin-bottom:6px">Details</h3>
        ${row('Type', esc(pubType(it)))}${row('Colour', `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${hex};vertical-align:-1px;margin-right:6px"></span>${esc(it.colour || '')}`)}${row('Size', esc(it.size))}${row('Design', esc(it.style))}${row('Collection', esc(it.collection || ''))}${row('Available', PUB_MODE[it.mode] || '')}</div>
      ${it.mode === 'sale' ? '' : `<div class="card pad"><h3 style="margin-bottom:4px">Availability</h3><p class="small muted" style="margin:0 0 12px">Pick up on your event day from ${fTime(atTime(new Date(), S().pickupStart))}, return the next day by ${fTime(atTime(new Date(), S().returnDeadline))}.</p>
        ${nights.length ? `<div class="lbl">${esc(S().festivalName || 'Festival')}</div><div class="chips scroll" style="margin-bottom:14px">${nights.map(f => `<span class="chip ${pubFree(code, f.d) ? '' : 'off'}" style="${pubFree(code, f.d) ? 'background:var(--good-soft);color:var(--good)' : 'background:var(--danger-soft);color:var(--danger);text-decoration:line-through'}">Night ${f.n} · ${fDateS(f.d)}</span>`).join('')}</div>` : ''}
        ${pubCal(code)}</div>`}
      <div class="banner info">${ic('hanger')} <span>Like this piece? Visit <b>${esc(PUB.shop.name || 'OMG Rental')}</b>${PUB.shop.city ? ', ' + esc(PUB.shop.city) : ''} and ask for code <b class="mono">${it.code}</b>.</span></div>
    </div></div>`;
}

/* =====================================================================
   §7 ROUTER + BOOT
   ===================================================================== */
function parseRoute() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'dashboard';
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'dashboard', parts, q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
const ROUTES = {
  dashboard: () => scrDashboard(), inventory: r => scrInventory(r), item: r => scrItem(r.parts[1]),
  customers: r => scrCustomers(r), customer: r => scrCustomer(r.parts[1]), new: () => scrWizard(),
  booking: r => scrBooking(r.parts[1], r), return: r => scrReturn(r.parts[1], r), returns: r => scrReturns(r),
  calendar: () => scrCalendar(), sales: () => scrSales(), sale: r => r.parts[1] === 'new' ? scrSaleNew(r) : scrSaleView(r.parts[1]),
  vouchers: r => r.parts[1] === 'new' ? scrVoucherNew() : scrVouchers(), reports: r => scrReports(r), settings: r => scrSettings(r), handoff: () => scrHandoff(),
};
function render() {
  if (LIVE && !TOKEN) return isPublicRoute() ? renderPublic() : renderLogin();   // QR scans without login → public catalogue
  if (LIVE && !LOADED) return;   // still loading the sheet — show nothing, save nothing
  if (LIVE) NOW = new Date();
  const r = parseRoute(); const fn = ROUTES[r.name] || ROUTES.dashboard;
  let out;
  try { out = fn(r); } catch (e) { console.error(e); out = { t: 'Error', html: `<div class="banner danger">${ic('alert')} Something went wrong: ${esc(e.message)}</div>` }; }
  TITLE = { t: out.t || '', s: out.s || '' };
  $('#page').innerHTML = out.html;
  renderShell(NAV_ALIAS[r.name] || r.name); renderTop(); renderTour();
  if (out.after) out.after();
  labelTables($('#page'));
  scheduleSync();
  document.title = `${out.t} · OMG Rental`;
}
function labelTables(root) {
  if (!root) return;
  root.querySelectorAll('table.tbl:not(.perm)').forEach(t => {
    const hs = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr => [...tr.children].forEach((td, i) => { if (hs[i] && td.colSpan === 1) td.setAttribute('data-l', hs[i]); }));
    t.classList.add('mcards');
  });
}
function go(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0, 0); });
function boot() {
  if (LIVE) {
    DB = fromTables({}); NOW = new Date(); CUR = { id: '', name: '', role: 'staff' }; TOUR.open = false; startLiveTimers();   // empty until the sheet loads — never demo data
    let sess = null; try { sess = JSON.parse(localStorage.getItem('omg_session') || 'null'); } catch (e) { }
    if (sess && sess.token) { TOKEN = sess.token; enterLive().catch(() => { TOKEN = null; render(); }); } else render();
    return;
  }
  DB = seedData(); DB.imap = Object.fromEntries(DB.items.map(i => [i.code, i]));
  NOW = new Date(SEED_NOW); CUR = DB.users[0];
  buildSeedBookings();
  DB.bookings.forEach(b => DB.audit.push({ at: b.createdAt, by: b.createdBy, role: 'Staff', action: 'Booking created', entity: b.no, detail: b.lines.map(l => l.code).join('+') }));
  DB.audit.push({ at: D(2026, 9, 27, 9, 55), by: 'Anjali — Staff', role: 'Staff', action: 'Signed in', entity: 'Session', detail: 'Shop tablet #1' });
  DB.audit.push({ at: D(2026, 9, 27, 10, 50), by: 'Shop Owner', role: 'Admin', action: 'Signed in', entity: 'Session', detail: '2-step verified · Chrome, desktop' });
  if (innerWidth < 760) TOUR.open = false;
  if (!location.hash) history.replaceState(null, '', '#/dashboard');
  render();
}
boot();
