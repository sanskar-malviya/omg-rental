<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b1638">
<meta name="apple-mobile-web-app-title" content="OMG Rental">
<meta name="application-name" content="OMG Rental">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f0b24a'/><stop offset='.55' stop-color='%23d9632e'/><stop offset='1' stop-color='%23b0265e'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><text x='32' y='41' font-family='Georgia,serif' font-size='21' font-weight='700' fill='white' text-anchor='middle'>OMG</text></svg>">
<title>OMG Rental — Smart Rental Management</title>
<!--
  OMG Rental · Clickable UX prototype (v1)
  ------------------------------------------------------------
  • Single file, no external dependencies. Open in Chrome.
  • ALL DATA IS IN-MEMORY SAMPLE DATA. Nothing is saved to a server or cloud.
    Reloading the page resets the demo.
  • Structure for developers:
      1. CSS design tokens + components
      2. JS  §1 Utilities (dates, money, icons)
         JS  §2 SEED DATA  (replace with API calls to the real database)
         JS  §3 DOMAIN LOGIC (availability, pricing, vouchers, late fees, returns)
              → in the real app this logic MUST live on the server (API) too.
         JS  §4 Roles / permissions / audit log
         JS  §5 Demo clock + guided tour (prototype-only)
         JS  §6 Screens (one render function per screen)
         JS  §7 Router + boot
  • See the "Developer Handoff" screen inside the app for the data model,
    state machines, availability algorithm and security requirements.
-->
<style>
:root{
  --bg:#faf6f0; --bg-2:#f4ede4; --surface:#ffffff; --surface-2:#fdfaf6;
  --ink:#2a1a22; --ink-2:#4a3a42; --muted:#85737b; --line:#ece2d9; --line-2:#e1d4c8;
  --brand:#7a1f4b; --brand-2:#9c2f63; --brand-deep:#4d1030; --brand-soft:#f7e8ef; --brand-ink:#ffffff;
  --accent:#e0962a; --accent-2:#c67c12; --accent-soft:#fdf1dc;
  --good:#2f7d57; --good-soft:#e5f3eb;
  --info:#2d62a6; --info-soft:#e7effa;
  --violet:#6b3fa0; --violet-soft:#efe8f8;
  --warn:#9a620a; --warn-soft:#fcf0d6;
  --repair:#b1502a; --repair-soft:#fbe8df;
  --danger:#b3263a; --danger-soft:#fbe7ea;
  --slate:#4b5563; --slate-soft:#eef0f3;
  --r-sm:10px; --r:16px; --r-lg:22px;
  --sh-1:0 1px 2px rgba(60,30,40,.05),0 2px 8px rgba(60,30,40,.04);
  --sh-2:0 8px 28px rgba(60,25,40,.10);
  --sh-3:0 24px 60px rgba(40,15,30,.22);
  --side:248px; --top:68px;
  --font:"Segoe UI",Inter,Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"Palatino Linotype",Palatino,"Iowan Old Style","Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
svg{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--brand-deep);color:#f6e6ee;display:flex;flex-direction:column;padding:18px 14px;gap:6px;
  background-image:radial-gradient(rgba(255,255,255,.07) 1.1px,transparent 1.5px),linear-gradient(180deg,#5b1638 0%,#3f0d28 100%);background-size:14px 14px,100% 100%}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#f0b24a,#d9632e 55%,#b0265e);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.3px;box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{display:block;font-family:var(--display);font-size:20px;letter-spacing:.2px;color:#fff}
.brand small{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#e9bfd2;opacity:.8}
.side .newbtn{margin:4px 4px 12px;justify-content:center}
.nav-sec{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#d9a9bf;opacity:.7;padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#f3dfe8;font-weight:600;font-size:14.5px;min-height:44px;position:relative}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--brand-deep);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.nav a.on svg{color:var(--brand)}
.nav a .badge{margin-left:auto}
.nav a.locked{opacity:.45}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:12px;color:#e8cbd8}
.side-foot b{color:#fff;display:block;font-size:13px}
.main{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(250,246,240,.9);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 14px,var(--brand) 14px 24px,transparent 24px 28px);opacity:.28;pointer-events:none}
.top .back{display:none}
.top-title{min-width:0}
.top-title h2{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{color:var(--muted);font-size:12px}
.top-search{flex:1;min-width:0;max-width:420px;margin-left:auto;position:relative}
.top-search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line-2);background:#fff;padding:0 44px 0 40px;font-size:14px;outline:none}
.top-search input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.top-search .s-ico{position:absolute;left:12px;top:12px;color:var(--muted)}
.top-search .s-scan{position:absolute;right:4px;top:4px;height:36px;width:36px;border:0;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.clock{line-height:1.2;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;border:1px dashed #d8b98a;background:var(--accent-soft);color:#6b4608;font-weight:700;font-size:13px;white-space:nowrap}
.clock small{font-weight:600;opacity:.75;font-size:10.5px;display:block;line-height:1;letter-spacing:.6px;text-transform:uppercase}
.who{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 6px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-weight:650;font-size:13px}
.who .avatar{width:32px;height:32px;font-size:12px}
.page{padding:24px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.bottomnav{display:none}

/* ---------- Typography & layout helpers ---------- */
h1.pg{font-family:var(--display);font-size:30px;font-weight:700;margin:0;letter-spacing:.1px;line-height:1.15}
h3{font-size:16px;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.strong{font-weight:700} .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .row.at{align-items:flex-start}
.between{justify-content:space-between} .grow{flex:1;min-width:0} .end{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:12px} .stack.s8{gap:8px} .stack.s16{gap:16px} .stack.s20{gap:20px}
.grid{display:grid;gap:16px}
.grid>*,.split>*,.split-l>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.split-l{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead .grow p{margin:6px 0 0;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:4px 0}
.sticky{position:sticky;top:calc(var(--top) + 16px)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15.5px}
.card-b{padding:16px 18px}
.card-f{padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.card.hl-danger{border-color:#efb9c1;box-shadow:0 0 0 3px var(--danger-soft)}
.card.hl-brand{border-color:#e6bcd0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-weight:650;font-size:14px;white-space:nowrap;transition:transform .06s,background .15s,box-shadow .15s;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(122,31,75,.25)}
.btn-primary:hover{background:var(--brand-2)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#3d2400}
.btn-accent:hover{background:#eaa33d}
.btn-soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn-soft:hover{background:#f1d9e5}
.btn-good{background:var(--good);border-color:var(--good);color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-soft{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(0,0,0,.04)}
.btn-wa{background:#e7f7ee;border-color:transparent;color:#137a43}
.btn-lg{min-height:54px;font-size:15.5px;padding:0 22px;border-radius:14px}
.btn-xl{min-height:62px;font-size:17px;padding:0 26px;border-radius:16px}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.icon-btn{width:44px;min-height:44px;padding:0}
.icon-btn.btn-sm{width:36px}

/* ---------- Pills, chips, badges ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--slate-soft);color:var(--slate)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-available{background:var(--good-soft);color:var(--good)}
.st-reserved{background:var(--info-soft);color:var(--info)}
.st-rented{background:var(--violet-soft);color:var(--violet)}
.st-inspection{background:var(--warn-soft);color:var(--warn)}
.st-repair{background:var(--repair-soft);color:var(--repair)}
.st-sold{background:var(--slate-soft);color:var(--slate)}
.st-lost{background:var(--danger-soft);color:var(--danger)}
.st-overdue{background:var(--danger);color:#fff}
.st-closed{background:var(--slate-soft);color:var(--slate)}
.st-cancelled{background:#f3f0ee;color:#8c7f78;text-decoration:line-through}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--accent);color:#3d2400;font-size:11.5px;font-weight:800}
.badge.red{background:var(--danger);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip .c{font-size:12px;color:var(--muted);font-weight:700}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .c{color:#d9cbd2}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-weight:700;font-size:12.5px;padding:2px 7px;border-radius:7px;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:9px;background:var(--bg-2);font-size:12.5px;font-weight:600}
.tag .sw{width:18px;height:18px;border-radius:6px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,select.input,textarea.input{height:48px;border-radius:12px;border:1px solid var(--line-2);background:#fff;padding:0 14px;font-size:15px;outline:none;width:100%}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.input.big{height:60px;font-size:22px;font-weight:700;letter-spacing:.5px}
.input-wrap{position:relative}
.input-wrap .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.input-wrap .input{padding-left:32px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-weight:650}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);font-weight:600}

/* ---------- Banners ---------- */
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;font-weight:600;border:1px solid transparent}
.banner.info{background:var(--info-soft);color:#1e4a82;border-color:#cfe0f5}
.banner.good{background:var(--good-soft);color:#1f5e40;border-color:#c5e5d3}
.banner.warn{background:var(--warn-soft);color:#6d4506;border-color:#f1dcaa}
.banner.danger{background:var(--danger-soft);color:#8e1b2c;border-color:#f3c3cb}
.banner.dark{background:var(--ink);color:#fff}
.proto-note{font-size:12px;color:#6d4506;background:var(--accent-soft);border:1px dashed #e2c287;border-radius:10px;padding:8px 12px}

/* ---------- Lists & tables ---------- */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);min-height:64px}
.lrow:last-child{border-bottom:0}
.lrow.click{cursor:pointer} .lrow.click:hover{background:var(--surface-2)}
.lrow .who2 b{display:block;font-size:15px}
.lrow .who2 span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl.nowrap td{white-space:nowrap}
.tbl tfoot td{font-weight:800;background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:14px;flex-shrink:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* ---------- Dashboard ---------- */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:22px 24px;border-radius:var(--r-lg);background:linear-gradient(120deg,#fff 0%,#fdf3f7 55%,#fdf1dc 100%);border:1px solid var(--line);position:relative;overflow:hidden;margin-bottom:18px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(224,150,42,.18) 0 2px,transparent 2.5px) 0 0/12px 12px;mask:radial-gradient(circle,#000 40%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 40%,transparent 70%)}
.hero .grow h1{margin-top:4px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px;box-shadow:var(--sh-1)}
.stat:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.stat .lab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.stat .lab i{width:9px;height:9px;border-radius:3px;display:inline-block}
.stat .v{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--muted)}
.stat.alert{background:var(--danger);border-color:var(--danger);color:#fff}
.stat.alert .lab,.stat.alert .s{color:#fff}
.money{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;overflow:hidden}
.money>div{padding:16px 18px;border-right:1px solid var(--line)}
.money>div:last-child{border-right:0}
.money .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.actions-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.due-head{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.due-head .big{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.deadline{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);color:#6d4506;font-weight:800;font-size:13.5px}
.deadline.late{background:var(--danger);color:#fff}
.progress{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);border-radius:99px}
.drow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.drow>.row{flex:1 1 300px;min-width:0}
.drow:last-child{border-bottom:0}
.drow .nm{font-weight:700;font-size:15.5px}
.drow .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.drow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto}
.drow.done{background:#fbfdfb}
.drow.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:#9bc4ae}
.drow.over{background:#fff8f9}
.itemchips{display:flex;gap:4px;flex-wrap:wrap}
.overdue-card{border:2px solid var(--danger);border-radius:var(--r);background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(179,38,58,.12)}
.overdue-card .oh{background:var(--danger);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.overdue-card .oh b{font-size:17px;letter-spacing:.4px}
.mini-list .lrow{min-height:56px;padding:10px 16px}

/* ---------- Inventory ---------- */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.icard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--sh-1);transition:box-shadow .15s,transform .15s;text-align:left;padding:0}
.icard:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.icard .img{aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.icard .img .pill{position:absolute;left:10px;top:10px}
.icard .img .mode{position:absolute;left:auto;right:10px;top:10px}
.icard .b{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.icard .b .nm{font-weight:700;font-size:14px;line-height:1.25}
.icard .b .sub{font-size:12px;color:var(--muted)}
.icard .b .pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.icard .b .pr b{font-size:16px}
.icard.dim{opacity:.55}
.thumb{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.thumb.sm{width:40px;height:40px;border-radius:10px}
.thumb.lg{width:100%;height:auto;aspect-ratio:1/1;border-radius:18px}
.availstrip{display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.availstrip i{height:30px;border-radius:5px;background:var(--good-soft);position:relative}
.availstrip i.b{background:var(--violet)}
.availstrip i.r{background:var(--info)}
.availstrip i.t{outline:2px solid var(--ink);outline-offset:1px}
.availstrip-l{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.perf{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.perf>div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.perf .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- Wizard ---------- */
.stepper{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.stepper .st{flex:1;min-width:120px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:650;font-size:13.5px;color:var(--muted);text-align:left}
.stepper .st i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2);font-style:normal;font-weight:800;font-size:13px;flex-shrink:0}
.stepper .st.on{border-color:var(--brand);color:var(--ink);box-shadow:0 0 0 3px var(--brand-soft)}
.stepper .st.on i{background:var(--brand);color:#fff}
.stepper .st.done{color:var(--ink-2)}
.stepper .st.done i{background:var(--good);color:#fff}
.summary .line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.summary .line.t{font-size:18px;font-weight:800;border-top:1px dashed var(--line-2);margin-top:6px;padding-top:12px}
.summary .line.neg span:last-child{color:var(--good);font-weight:700}
.datecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dcard{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--surface-2)}
.dcard .k{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.dcard .d{font-size:17px;font-weight:800;margin-top:4px}
.dcard .t{font-size:13px;font-weight:700;margin-top:2px}
.dcard.pick{background:var(--info-soft);border-color:#cfe0f5} .dcard.pick .k{color:var(--info)}
.dcard.ev{background:var(--accent-soft);border-color:#f1dcaa} .dcard.ev .k{color:var(--accent-2)}
.dcard.ret{background:var(--good-soft);border-color:#c5e5d3} .dcard.ret .k{color:var(--good)}
.dcard.ret .t{color:#16553a}
.evchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.evchip{min-width:78px;min-height:84px;border-radius:14px;border:1px solid var(--line-2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1}
.evchip small{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.evchip b{font-size:22px}
.evchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.evchip.on small{color:#f3cfe0}
.pkgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pkg{border-radius:14px;border:1px solid var(--line-2);background:#fff;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:98px}
.pkg b{font-size:14px} .pkg .p{font-size:18px;font-weight:800;color:var(--brand)}
.pkg .inc{font-size:11.5px;color:var(--muted)}
.pkg.queen{background:linear-gradient(135deg,#fff 0%,#fdf1dc 100%);border-color:#ecd09b}
.cartrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line-2)}
.cartrow:last-child{border-bottom:0}
.pick-list{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.pick-list .lrow{min-height:60px;padding:10px 14px}
.mbar{display:none}
.cond{display:flex;gap:6px;flex-wrap:wrap}
.cond button{min-height:44px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:#fff;font-weight:650;font-size:13px}
.cond button.on.c-good{background:var(--good);border-color:var(--good);color:#fff}
.cond button.on.c-minor{background:var(--accent);border-color:var(--accent);color:#3d2400}
.cond button.on.c-major,.cond button.on.c-missing{background:var(--danger);border-color:var(--danger);color:#fff}
.cond button.on.c-stain,.cond button.on.c-repair{background:var(--repair);border-color:var(--repair);color:#fff}
.retitem{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.retitem:last-child{border-bottom:0}
.settle .line{display:flex;justify-content:space-between;padding:8px 0;font-size:15px}
.settle .line.minus span:last-child{color:var(--danger);font-weight:700}
.settle .line.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-size:22px;font-weight:800}
.timeline{display:flex;gap:0;align-items:flex-start}
.timeline .tl{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.timeline .tl i{width:30px;height:30px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;z-index:1;font-style:normal;border:2px solid var(--bg-2)}
.timeline .tl::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:3px;background:var(--bg-2)}
.timeline .tl:first-child::before{display:none}
.timeline .tl.done i{background:var(--good);border-color:var(--good);color:#fff}
.timeline .tl.done::before,.timeline .tl.cur::before{background:var(--good)}
.timeline .tl.cur i{background:#fff;border-color:var(--brand);color:var(--brand)}
.timeline .tl.cur{color:var(--ink)}
.success-hero{text-align:center;padding:30px 20px;background:linear-gradient(180deg,var(--good-soft),#fff);border-radius:var(--r-lg);border:1px solid #c5e5d3}
.success-hero .tick{width:72px;height:72px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 10px 30px rgba(47,125,87,.35)}
.wa-bubble{background:#e7ffdb;border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08);max-width:440px}
.wa-bg{background:#efe7dd;padding:14px;border-radius:14px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.5px);background-size:10px 10px}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:center;padding:4px 0}
.cal .day{min-height:96px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:12px}
.cal .day .n{font-weight:800;font-size:14px}
.cal .day.out{background:transparent;border-style:dashed;opacity:.45}
.cal .day.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cal .day.today .n{background:var(--brand);color:#fff;border-radius:8px;padding:0 7px;align-self:flex-start}
.cal .day.sel{background:var(--brand-soft);border-color:var(--brand)}
.cal .ev{display:flex;align-items:center;gap:5px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap}
.cal .ev.p{background:var(--info-soft);color:var(--info)}
.cal .ev.e{background:var(--accent-soft);color:var(--accent-2)}
.cal .ev.r{background:var(--good-soft);color:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:46px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- Settings / architecture ---------- */
.arch{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.arch .box{flex:1;min-width:150px;border:1px solid var(--line-2);border-radius:14px;background:#fff;padding:14px;display:flex;flex-direction:column;gap:6px}
.arch .box b{font-size:14px}
.arch .box ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.arch .arr{display:grid;place-items:center;padding:0 6px;color:var(--brand);font-weight:900;font-size:20px}
.arch .box.db{background:var(--brand-soft);border-color:#e6bcd0}
.perm td,.perm th{text-align:center} .perm td:first-child,.perm th:first-child{text-align:left}
.yes{color:var(--good);font-weight:900} .no{color:#c9bcc2}
.secitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.secitem:last-child{border-bottom:0}
.secitem .ic{width:36px;height:36px;border-radius:10px;background:var(--good-soft);color:var(--good);display:grid;place-items:center;flex-shrink:0}
.lock{max-width:520px;margin:40px auto;text-align:center;padding:36px 24px}
.lock .ic{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.doc h3{font-family:var(--display);font-size:20px;margin:6px 0 10px}
.doc p,.doc li{color:var(--ink-2);font-size:14.5px}
.doc pre{background:#241620;color:#f5e6ee;border-radius:12px;padding:14px;overflow:auto;font-size:12.5px;line-height:1.55}
.doc code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--bg-2);padding:1px 6px;border-radius:6px}
.doc pre code{background:transparent;padding:0}

/* ---------- Modal / sheet / toast / tour ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,15,25,.45);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-3);width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;animation:pop .18s}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal-h h3{font-size:17px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);position:sticky;bottom:0}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--sh-3);animation:pop .2s;display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.good{background:#1f5e40} .toast.bad{background:var(--danger)}
.tour-fab{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 18px 0 14px;border-radius:99px;border:0;background:var(--ink);color:#fff;font-weight:700;box-shadow:var(--sh-3)}
.tour-fab .ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center}
.tour-fab .ring span{width:22px;height:22px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:10px}
.tour{position:fixed;right:20px;bottom:84px;z-index:95;width:380px;max-height:calc(100vh - 170px);background:#fff;border-radius:20px;box-shadow:var(--sh-3);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s}
.tour-h{padding:16px 18px;background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff}
.tour-h small{opacity:.8}
.tour-b{overflow:auto;padding:8px 0}
.tstep{display:flex;gap:10px;padding:8px 16px;align-items:flex-start;font-size:13.5px}
.tstep i{width:24px;height:24px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
.tstep.done{color:var(--muted)} .tstep.done i{background:var(--good);color:#fff}
.tstep.cur{background:var(--brand-soft)} .tstep.cur i{background:var(--brand);color:#fff}
.tstep .h{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.tour-sec{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px}
.menu{position:absolute;right:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);width:300px;padding:8px;z-index:60;animation:pop .15s}
.menu button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;min-height:46px;font-weight:600}
.menu button:hover{background:var(--surface-2)}
.menu button.on{background:var(--brand-soft);color:var(--brand)}
.menu .mh{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}

/* ---------- Responsive: tablet (primary shop device) ---------- */
@media (max-width:1280px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pkgs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1180px){
  :root{--side:92px}
  .brand{flex-direction:column;padding:0 0 10px;gap:6px}
  .brand .bt{display:none}
  .side{padding:14px 8px;align-items:stretch}
  .side .newbtn{padding:0;flex-direction:column;gap:2px;min-height:64px;font-size:11px;margin:0 0 8px}
  .nav-sec,.side-foot{display:none}
  .nav a{flex-direction:column;gap:4px;font-size:11px;padding:10px 4px;text-align:center;min-height:62px;justify-content:center}
  .nav a .badge{position:absolute;top:4px;right:8px;margin:0;min-width:18px;height:18px;font-size:10px}
  .split{grid-template-columns:minmax(0,1fr) 320px}
  .actions-grid{grid-template-columns:1fr}
  .split-l{grid-template-columns:320px minmax(0,1fr)}
}
@media (max-width:960px){
  .split,.split-l{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .money{grid-template-columns:repeat(2,minmax(0,1fr))}
  .money>div:nth-child(2){border-right:0}
  .money>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .top-search{max-width:none}
  .clock .ct{display:none}
  .who .wn{display:none}
  .wiz-side{display:none}
  .hero{flex-direction:column;align-items:stretch}
  .mbar{display:flex;position:sticky;bottom:0;z-index:20;margin:16px -24px -24px;padding:12px 24px;background:#fff;border-top:1px solid var(--line);align-items:center;gap:12px;box-shadow:0 -8px 24px rgba(0,0,0,.06)}
}
/* ---------- Responsive: phone ---------- */
@media (max-width:760px){
  body{font-size:15px}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:0 12px;gap:8px;height:60px;--top:60px}
  .top .back{display:inline-flex}
  .top-title{display:none}
  .top-search input{height:42px;font-size:14px}
  .clock{padding:0 8px;height:42px}
  .clock small,.clock .cd{display:none}
  .who{padding:0 4px;height:42px}
  .page{padding:16px 16px 110px}
  h1.pg{font-size:24px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{min-height:78px;padding:12px}
  .stat .v{font-size:24px}
  .hero{padding:18px}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1}
  .igrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .datecards{grid-template-columns:1fr}
  .pkgs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drow>.row{flex-basis:100%}
  .drow .acts{justify-content:flex-start}
  .card-h,.card-b,.lrow,.drow,.due-head,.retitem{padding-left:14px;padding-right:14px}
  .cal .day{min-height:64px;padding:5px;font-size:10px}
  .cal .ev{padding:1px 4px;gap:3px}
  .cal .lbl2{display:none}
  .mbar{margin:16px -16px -110px;padding:12px 16px 12px;bottom:70px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;min-height:54px;justify-content:center;position:relative}
  .bottomnav a.on{color:var(--brand)}
  .bottomnav a.fab span.f{width:54px;height:54px;margin-top:-26px;border-radius:18px;background:linear-gradient(140deg,var(--brand-2),var(--brand-deep));color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(122,31,75,.4);border:3px solid #fff}
  .bottomnav a.fab{color:var(--brand)}
  .bottomnav .badge{position:absolute;top:2px;right:18%;min-width:18px;height:18px;font-size:10px}
  .tour-fab{bottom:150px;right:10px;min-height:44px;padding:0 10px 0 8px;opacity:.92}
  .tour-fab .tl{display:none}
  .tour{right:8px;left:8px;width:auto;bottom:140px}
  .scrim{align-items:end;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:92vh}
  .menu{position:fixed;left:8px;right:8px;top:64px;width:auto}
  .timeline .tl{font-size:10.5px}
  .toasts{bottom:150px}
}
body.login-mode .side,body.login-mode .top,body.login-mode .bottomnav,body.login-mode #tourRoot{display:none}
body.login-mode .app{grid-template-columns:1fr}
/* Public catalogue (QR scans, no login) */
body.public-mode .page{max-width:1100px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:10px;padding:4px 0 16px;flex-wrap:wrap}
.ptop a{color:inherit;text-decoration:none}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.pitem{grid-template-columns:minmax(0,1fr)}}
.pgal .main{aspect-ratio:3/4;border-radius:var(--r-lg);overflow:hidden;display:grid;place-items:center}
.pgal .main img{width:100%;height:100%;object-fit:cover;display:block}
.pgal .ths{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.pgal .ths img{width:64px;height:64px;flex:none;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}
.pgal .ths img.on{border-color:var(--brand)}
.pcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.pcal .h{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.pcal .d{padding:9px 0;border-radius:8px;font-weight:700;font-size:14px;position:relative}
.pcal .d.free{background:var(--good-soft);color:var(--good)}

function defaultEvent() {
  const pickupEndToday = atTime(NOW, S().pickupEnd);
  return addDays(sod(NOW), NOW < pickupEndToday ? 0 : 1);   // today, or tomorrow once today's pickup window has passed
}
/* Festival (Navratri) nights from Settings, e.g. 11–19 Oct 2026 → [{d, n:1..9}] */
function festivalNights() {
  const s = S(); if (!s.festivalStart || !+s.festivalNights) return [];
  const st = parseIso(s.festivalStart);
  return [...Array(+s.festivalNights)].map((_, i) => ({ d: addDays(st, i), n: i + 1 }));
}
const festivalNightOf = d => (festivalNights().find(f => sameDay(f.d, d)) || {}).n || 0;
/* Standard rental length in hours = pickup time on day 0 → return deadline next day (e.g. 2 PM → 12 PM = 22 h) */
function standardHours() { const s = S(); const t = x => { const [h, m] = x.split(':').map(Number); return h + m / 60; }; return 24 - t(s.pickupStart) + t(s.returnDeadline); }

/* ---------- Pricing ---------- */
function quote({ lines, pkgs, pickupAt, returnBy, voucherCode, customerId, offerPrice }) {
  const itemsSum = sum(lines, l => item(l.code).rent);
  const base = sum(lines.filter(l => l.pkg == null), l => item(l.code).rent) + sum(pkgs, p => p.price);
  const hours = (returnBy - pickupAt) / 3.6e6;
  const extraDays = Math.max(0, Math.ceil((hours - standardHours() - 0.01) / 24));   // beyond the standard same-day → next-noon rental
  const extraAmt = Math.round(base * extraDays * S().extraDayPct / 100);
  const gross = base + extraAmt;
  let v = null, discount = 0;
  const manual = offerPrice != null && offerPrice !== '' && +offerPrice < gross;
  if (manual) discount = gross - Math.max(0, Math.round(+offerPrice));            // offer price typed by staff → discount worked out
  else if (voucherCode) { v = checkVoucher(voucherCode, { amount: gross, kind: 'rental', customerId }); if (v.ok) discount = v.discount; }
  const deposit = lines.length ? Math.max(S().minDeposit, sum(lines, l => item(l.code).deposit)) : 0;
  return { itemsSum, base, pkgSavings: itemsSum - base, extraDays, extraAmt, gross, v, discount, manual, discountPct: gross ? Math.round(discount / gross * 1000) / 10 : 0, rentNet: gross - discount, deposit };
}

/* ---------- Vouchers ---------- */
function voucherState(v) {
  if (v.status === 'disabled') return 'disabled';
  if (sod(NOW) > v.to) return 'expired';
  if (NOW < v.from) return 'scheduled';
  if (v.limit && v.used >= v.limit) return 'used up';
  return 'active';
}
function checkVoucher(code, { amount, kind, collection = 'garba' }) {
  const v = DB.vouchers.find(x => x.code === String(code).trim().toUpperCase());
  if (!v) return { ok: false, msg: 'Voucher code not found' };
  const st = voucherState(v);
  if (st === 'disabled') return { ok: false, msg: `${v.code} has been disabled` };
  if (st === 'expired') return { ok: false, msg: `${v.code} expired on ${fDateS(v.to)}` };
  if (st === 'scheduled') return { ok: false, msg: `${v.code} is valid from ${fDateS(v.from)}` };
  if (st === 'used up') return { ok: false, msg: `${v.code} has reached its usage limit (${v.limit})` };
  if (!v.appliesTo.includes(kind)) return { ok: false, msg: `${v.code} is not valid on ${kind === 'rental' ? 'rentals' : kind === 'sale' ? 'purchases' : kind}` };
  if (v.collection !== 'all' && v.collection !== collection) return { ok: false, msg: `${v.code} is only for the ${v.collection} collection` };
  if (amount < v.min) return { ok: false, msg: `${v.code} needs a minimum of ${rs(v.min)} (current ${rs(amount)})` };
  let d = v.type === 'fixed' ? v.value : Math.round(amount * v.value / 100);
  if (v.maxOff) d = Math.min(d, v.maxOff);
  d = Math.min(d, amount);
  return { ok: true, discount: d, v, msg: `${v.code} applied — ${rs(d)} off` };
}
const vDesc = v => v.type === 'fixed' ? `${rs(v.value)} OFF` : `${v.value}% OFF${v.maxOff ? ' (max ' + rs(v.maxOff) + ')' : ''}`;

/* ---------- Late fee (configurable in Settings) ---------- */
function lateFee(returnBy, at) {
  const s = S(); const mins = Math.floor((at - returnBy) / 60000);
  if (mins <= 0) return { mins: 0, fee: 0, late: false, grace: false };
  if (mins <= s.graceMin) return { mins, fee: 0, late: true, grace: true };
  let fee = 0;
  if (s.lateMode === 'flat') fee = s.lateAmount + Math.floor(mins / 1440) * s.latePerDay;
  else if (s.lateMode === 'hourly') fee = Math.ceil(mins / 60) * s.lateAmount;
  else fee = Math.ceil(mins / 1440) * s.lateAmount;
  if (s.lateCap) fee = Math.min(fee, s.lateCap);
  return { mins, fee, late: true, grace: false };
}
function lateRuleText() {
  const s = S();
  const base = s.lateMode === 'flat' ? `${rs(s.lateAmount)} once late${s.latePerDay ? `, + ${rs(s.latePerDay)} per extra day` : ''}`
    : s.lateMode === 'hourly' ? `${rs(s.lateAmount)} per started hour` : `${rs(s.lateAmount)} per started day`;
  return `After ${fHHMM(s.returnDeadline)} + ${s.graceMin} min grace: ${base}${s.lateCap ? ` (max ${rs(s.lateCap)})` : ''}`;
}

/* ---------- Money on a booking (derived from the payment ledger) ----------
   Ledger kinds: rent · deposit · topup (extra collected at return) · refund · damage · late
   Deposits are a LIABILITY until the return is settled — never count them as revenue. */
function money(b) {
  const P = (k, f = () => true) => sum(b.payments.filter(p => p.kind === k && f(p)), p => p.amount);
  const rentNet = b.rentGross - b.discount;
  const rentPaid = P('rent'), depPaid = P('deposit'), topup = P('topup'), refunded = P('refund'), damage = P('damage'), late = P('late');
  const rentFromDep = P('rent', p => p.mode === 'Deposit deduction');
  const held = depPaid + topup - refunded - damage - late - rentFromDep;
  const open = ['reserved', 'picked', 'returned_pending'].includes(b.status);
  const rentDue = open ? Math.max(0, rentNet - rentPaid) : 0;
  const depDue = ['reserved', 'picked'].includes(b.status) ? Math.max(0, b.depositDue - depPaid) : 0;
  return { rentNet, rentPaid, depPaid, topup, held, refunded, damage, late, rentDue, depDue, outstanding: rentDue + depDue };
}
function recordPayment(b, amount, mode, at, by) {
  const m = money(b);
  let rest = amount;
  const r = Math.min(rest, m.rentDue); if (r > 0) { b.payments.push({ kind: 'rent', amount: r, mode, at, by }); rest -= r; }
  if (rest > 0) b.payments.push({ kind: 'deposit', amount: rest, mode, at, by });
}

/* ---------- Booking lifecycle (core — shared by seed + API) ----------
   reserved → picked (handover) → returned_pending (optional quick receive) → closed
   reserved → cancelled  |  any → void (manager).  Nothing is ever deleted. */
function makeBooking({ customerId, lines, pkgs, eventDate, pickupAt, returnBy, voucherCode, offerPrice, createdAt, by }) {
  const q = quote({ lines, pkgs, pickupAt, returnBy, voucherCode, customerId, offerPrice });
  const ratio = q.itemsSum ? q.rentNet / q.itemsSum : 0;
  DB.seq.booking++;
  const b = {
    no: 'OMG-' + pad(DB.seq.booking, 5), customerId, eventDate, pickupAt, returnBy,
    lines: lines.map(l => ({ code: l.code, pkg: l.pkg ?? null, list: item(l.code).rent, deposit: item(l.code).deposit, alloc: Math.round(item(l.code).rent * ratio) })),
    pkgs: pkgs.map(p => ({ ...p })), rentGross: q.gross, extraDays: q.extraDays, discount: q.discount,
    voucher: q.v && q.v.ok ? q.v.v.code : null, depositDue: q.deposit, status: 'reserved', payments: [],
    createdAt, createdBy: by, events: [{ at: createdAt, by, text: 'Booking created' }], calls: [],
  };
  if (b.voucher) DB.vouchers.find(v => v.code === b.voucher).used++;
  b.lines.forEach(l => item(l.code).log.push({ at: createdAt, by, text: `Reserved on ${b.no} (${fDateS(pickupAt)}–${fDateS(returnBy)})` }));
  return b;
}
function handoverCore(b, at, by, collect, mode) {
  if (collect > 0) recordPayment(b, collect, mode, at, by);
  b.status = 'picked'; b.pickedAt = at;
  b.lines.forEach(l => { const it = item(l.code); it.status = 'out'; it.log.push({ at, by, text: `Handed over · ${b.no}` }); });
  b.events.push({ at, by, text: `Items handed over${collect > 0 ? ` · collected ${rs(collect)} (${mode})` : ''}` });
}
function receiveCore(b, at, by) {
  b.status = 'returned_pending'; b.receivedAt = at;
  b.lines.forEach(l => { const it = item(l.code); it.status = 'inspection'; it.log.push({ at, by, text: `Received back · ${b.no} · awaiting inspection` }); });
  b.events.push({ at, by, text: 'Items received — inspection pending' });
}
function completeCore(b, { at, by, lines, lateFeeAmt, lateMins, waived, refundMode, collectMode }) {
  const receivedAt = b.receivedAt || at;
  const m = money(b);
  const damage = sum(Object.values(lines), x => +x.charge || 0);
  const C = damage + lateFeeAmt + m.rentDue, H = m.held;
  if (H < C) b.payments.push({ kind: 'topup', amount: C - H, mode: collectMode || 'Cash', at, by });
  if (m.rentDue) b.payments.push({ kind: 'rent', amount: m.rentDue, mode: 'Deposit deduction', at, by });
  if (damage) b.payments.push({ kind: 'damage', amount: damage, mode: 'Deposit deduction', at, by });
  if (lateFeeAmt) b.payments.push({ kind: 'late', amount: lateFeeAmt, mode: 'Deposit deduction', at, by });
  const refund = Math.max(0, H - C);
  if (refund) b.payments.push({ kind: 'refund', amount: refund, mode: refundMode, at, by });
  b.returnInfo = { receivedAt, inspectedAt: at, lines: JSON.parse(JSON.stringify(lines)), lateFee: lateFeeAmt, lateMins, waived: !!waived, refund, refundMode: refund ? refundMode : null, collected: Math.max(0, C - H), collectMode: C > H ? collectMode : null, rentDeducted: m.rentDue };
  b.status = 'closed'; b.closedAt = at;
  b.lines.forEach(l => {
    const it = item(l.code); const r = lines[l.code] || { cond: 'good', charge: 0 };
    const cd = CONDS.find(c => c.k === r.cond);
    it.status = cd.next;
    if (r.cond !== 'good') it.log.push({ at, by, text: `Returned ${cd.label}${+r.charge ? ` · ${rs(r.charge)} charged` : ''}${r.note ? ` · “${r.note}”` : ''} · ${b.no}` });
    it.log.push({ at, by, text: `Inspection complete → ${NEXT_LABEL[cd.next]}` });
    if (r.cond === 'minor' && it.condition === 'Excellent') it.condition = 'Good';
  });
  b.events.push({ at, by, text: `Return inspected & closed · ${refund ? 'refunded ' + rs(refund) + ' (' + refundMode + ')' : C > H ? 'collected ' + rs(C - H) : 'no refund due'}` });
}

/* ---------- Seed bookings (sample history) ---------- */
function buildSeedBookings() {
  const s = S(), today = sod(SEED_NOW);
  DB.bookingSeed.forEach(([md, cname, codes, o], i) => {
    const [mm, dd] = md.split('-').map(Number);
    const dts = datesForEvent(D(2026, mm, dd));
    const c = DB.cByName(cname);
    const staff = i % 2 ? 'Rahul — Staff' : 'Anjali — Staff';
    const pkgDef = o.pkg ? DB.packages.find(p => p.key === o.pkg) : null;
    const lines = codes.map(code => ({ code, pkg: pkgDef ? 0 : null }));
    const pkgs = pkgDef ? [{ key: pkgDef.key, name: pkgDef.name, price: pkgDef.price }] : [];
    const createdAt = addMin(dts.pickupAt, -(60 * 24 * (2 + i % 6) + 60 * (i % 7) + 17));
    const b = makeBooking({ customerId: c.id, lines, pkgs, ...dts, voucherCode: o.voucher, createdAt, by: staff });
    const m0 = money(b);
    const pay = o.advance ? o.advance : o.depositLater ? m0.rentNet : m0.rentNet + b.depositDue;
    recordPayment(b, pay, i % 3 ? 'UPI' : 'Cash', createdAt, staff);
    if (o.noAuto) b.noAuto = true;
    if (o.noAutoReturn) b.noAutoReturn = true;
    if (o.autoRet) b.autoRet = o.autoRet;
    DB.bookings.push(b);
    if (dts.pickupAt < SEED_NOW) {
      const m1 = money(b);
      handoverCore(b, addMin(dts.pickupAt, 12 + (i * 7) % 40), staff, m1.outstanding - (o.owe || 0), 'UPI');
      const goodLines = () => Object.fromEntries(codes.map(cd => [cd, { cond: 'good', charge: 0 }]));
      if (o.pending) receiveCore(b, atTime(today, o.pending), staff);
      else if (o.retAt) completeCore(b, { at: atTime(today, o.retAt), by: staff, lines: goodLines(), lateFeeAmt: 0, lateMins: 0, refundMode: 'UPI' });
      else if (dts.returnBy < today && !o.noAuto) {
        const lines2 = goodLines();
        if (o.dmg) for (const k in o.dmg) lines2[k] = { cond: o.dmg[k][0], charge: o.dmg[k][1] };
        const at = o.late ? addMin(dts.returnBy, o.late) : addMin(dts.returnBy, -(35 + (i * 13) % 100));
        const lf = o.late ? lateFee(dts.returnBy, at) : { fee: 0, mins: 0 };
        completeCore(b, { at, by: staff, lines: lines2, lateFeeAmt: lf.fee, lateMins: lf.mins, refundMode: i % 2 ? 'UPI' : 'Cash' });
      }
    }
  });
  // Sample sales
  DB.sales.push({ id: 'S-' + (++DB.seq.sale), code: 'G030', customerId: 'CU-1005', price: 2299, list: 2299, discount: 0, voucher: null, mode: 'UPI', at: D(2026, 9, 24, 18, 20), by: 'Meera — Manager' });
  DB.sales.push({ id: 'S-' + (++DB.seq.sale), code: 'J005', customerId: null, walkIn: 'Walk-in customer', price: 799, list: 799, discount: 0, voucher: null, mode: 'Cash', at: D(2026, 9, 26, 16, 5), by: 'Rahul — Staff' });
  item('G030').log.push({ at: D(2026, 9, 24, 18, 20), by: 'Meera — Manager', text: 'SOLD for ₹2,299 (S-501)' });
  item('J005').log.push({ at: D(2026, 9, 26, 16, 5), by: 'Rahul — Staff', text: 'SOLD for ₹799 (S-502)' });
}

/* Run fn if the current user has permission; otherwise ask for a manager PIN (logged). */
function guard(perm, what, fn) {
  if (can(perm)) return fn(null);
  openModal({
    title: 'Manager approval needed',
    body: `<div class="stack">
      <div class="banner warn">${ic('lock')}<div><b>${esc(what)}</b><div class="small">Your role (${ROLE_LABEL[CUR.role]}) can’t do this alone. A manager can approve with their PIN — the approval is recorded in the audit log.</div></div></div>
      <div class="field"><label>Manager PIN</label><input id="pinIn" class="input big" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off"></div>
      ${LIVE ? '' : '<div class="hint">Demo PIN: <b>1234</b></div>'}<div id="pinErr" class="err"></div></div>`,
    foot: `<button class="btn btn-lg" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-lg" id="pinOk">Approve</button>`,
  });
  setTimeout(() => $('#pinIn') && $('#pinIn').focus(), 50);
  $('#pinOk').onclick = async () => {
    const pin = $('#pinIn').value; let approver = null;
    if (LIVE) { try { const r = await api('verifyPin', { pin }); if (r.ok) approver = r.name; } catch (e) { $('#pinErr').textContent = 'No internet'; return; } }
    else if (pin === S().managerPin) approver = 'Meera — Manager';
    if (!approver) { $('#pinErr').textContent = 'Incorrect PIN'; return; }
    closeModal(); audit('Manager override', what, `Approved for ${CUR.name}`, approver); fn(approver);
  };
}

  const bot = 'Anjali — Staff';
  DB.bookings.filter(b => b.status === 'reserved').forEach(b => {
    const at = addMin(b.pickupAt, 25);
    if (at <= t && !b.noAuto) {
      const prev = NOW; NOW = at; handoverCore(b, at, bot, money(b).outstanding, 'UPI'); NOW = prev;
      if (b.userCreated) toast(`Demo: ${b.no} was handed over at ${fTime(at)} on ${fDateS(at)}`, 'good');

  DB.bookings.filter(b => b.status === 'picked' && !b.noAuto && !b.userCreated).forEach(b => {
    let at = null;
    if (b.autoRet) { const x = atTime(b.returnBy, b.autoRet); if (x <= t) at = x; }
    else if (!b.noAutoReturn && b.returnBy < sod(t)) at = addMin(b.returnBy, -50);
    if (at) completeCore(b, { at, by: bot, lines: Object.fromEntries(b.lines.map(l => [l.code, { cond: 'good', charge: 0 }])), lateFeeAmt: 0, lateMins: 0, refundMode: 'UPI' });

  DB.bookings.filter(b => b.status === 'returned_pending' && !b.userCreated && sod(b.receivedAt) < sod(t)).forEach(b => {

/* ---------- QR scanning (real camera) ----------
   Uses the browser's built-in BarcodeDetector when available (Chrome/Android), otherwise jsQR.
   Libraries are bundled in /vendor (Netlify) with a CDN fallback (standalone file). */
const LIBS = {};
function loadScript(local, cdn) {
  if (LIBS[local]) return LIBS[local];
  const add = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
  LIBS[local] = add(local).catch(() => add(cdn));
  return LIBS[local];
}
const loadJsQR = () => loadScript('vendor/jsQR.min.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js');
const loadQRGen = () => loadScript('vendor/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');
/* What a tag contains: the app link to the item (works with any phone camera too). */
function tagText(code) {
  const base = /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
  return base ? base + '#/item/' + code : 'OMG:' + code;
}
/* Turn scanned text (URL, "OMG:G021" or plain "G021") into an item code */
function codeFromScan(text) {
  const t = String(text || '').trim();
  const m = t.match(/#\/item\/([A-Za-z]{1,3}\d{2,6})/) || t.match(/^(?:OMG[:\-\s])?([A-Za-z]{1,3}\d{2,6})$/i);
  return m ? m[1].toUpperCase() : null;
}
let SCAN = null;
function stopScan() {
  if (!SCAN) return;
  clearTimeout(SCAN.timer);
  if (SCAN.stream) SCAN.stream.getTracks().forEach(t => t.stop());
  SCAN = null;
}
function scanDone(code) {
  const cb = SCAN && SCAN.onCode; stopScan(); closeModal();
  if (navigator.vibrate) navigator.vibrate(60);
  if (cb) cb(code); else go('#/item/' + code);
}
function scanManual(v) {
  const code = codeFromScan(v) || String(v || '').trim().toUpperCase();
  if (!code) return;
  if (!item(code)) { const el = $('#scanStat'); if (el) el.textContent = `No item with code ${code}`; return; }
  scanDone(code);
}
async function scanModal(onCode) {
  stopScan();
  openModal({
    title: onCode ? 'Scan tag to add' : 'Scan item tag',
    body: `<div class="stack">
      <div class="scanbox"><video id="scanVid" playsinline muted></video><div class="frame"></div></div>
      <div class="scanstat" id="scanStat">Starting camera…</div>
      <div class="field"><label>Or type / scan with a USB scanner</label><input class="input big mono" id="scanIn" placeholder="G021" autocomplete="off" onkeydown="if(event.key==='Enter')scanManual(this.value)"></div>
      <div class="hint">Tip: good light, hold the tag 10–20 cm from the camera. Get tags from any item → Download QR.</div></div>`,
  });
  SCAN = { onCode, stream: null, timer: null };
  const mine = SCAN;
  const status = m => { const el = $('#scanStat'); if (el) el.textContent = m; };
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status('Camera works only when the app is opened over https (your Netlify link). You can type the code below.'); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    if (SCAN !== mine || !$('#scanVid')) { stream.getTracks().forEach(t => t.stop()); return; }
    SCAN.stream = stream;
    const v = $('#scanVid'); v.srcObject = stream; await v.play();
    let native = null;
    if ('BarcodeDetector' in window) {
      try { const f = await window.BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) native = new window.BarcodeDetector({ formats: f.filter(x => ['qr_code', 'code_128', 'code_39', 'ean_13'].includes(x)) }); } catch (e) { native = null; }
    }
    if (!native) { status('Loading scanner…'); await loadJsQR(); }
    status('Point the camera at the QR tag');
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
    const tick = async () => {
      if (SCAN !== mine || !$('#scanVid')) return;
      try {
        if (v.readyState >= 2 && v.videoWidth) {
          let text = null;
          if (native) { const r = await native.detect(v); if (r && r[0]) text = r[0].rawValue; }
          else {
            const sc = Math.min(1, 800 / Math.max(v.videoWidth, v.videoHeight));
            c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
            ctx.drawImage(v, 0, 0, c.width, c.height);
            const r = window.jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
            if (r) text = r.data;
          }
          if (text) {
            const code = codeFromScan(text);
            if (code && item(code)) return scanDone(code);
            status(code ? `No item with code ${code} in this shop` : 'That is not an OMG Rental tag');
          }
        }
      } catch (e) { /* keep trying */ }
      if (SCAN === mine) SCAN.timer = setTimeout(tick, 180);
    };
    tick();
  } catch (e) {
    status(e && e.name === 'NotAllowedError' ? 'Camera permission is blocked. Allow the camera for this site (tap the 🔒 in the address bar), or type the code below.'
      : e && e.name === 'NotFoundError' ? 'No camera found on this device. Type the code below or use a USB scanner.'
        : 'Could not start the camera (' + ((e && (e.message || e.name)) || 'error') + '). Type the code below.');
  }
}

/* ---------- DASHBOARD ---------- */
function dayData() {
  const t0 = sod(NOW), t1 = addDays(t0, 1), inT = d => d && d >= t0 && d < t1;
  const live = DB.bookings.filter(b => !['cancelled', 'void'].includes(b.status));
  const dueAll = live.filter(b => inT(b.returnBy));
  const overdue = live.filter(isOverdue).sort((a, b) => a.returnBy - b.returnBy);
  const dueWaiting = dueAll.filter(b => b.status === 'picked' && !isOverdue(b));
  const dueDone = dueAll.filter(b => ['returned_pending', 'closed'].includes(b.status));
  const pickups = live.filter(b => inT(b.pickupAt)).sort((a, b) => (a.status === 'reserved' ? 0 : 1) - (b.status === 'reserved' ? 0 : 1));
  const pendingPay = live.filter(b => ['reserved', 'picked'].includes(b.status) && money(b).outstanding > 0);
  const inspect = live.filter(b => b.status === 'returned_pending');
  return { dueAll, overdue, dueWaiting, dueDone, pickups, pendingPay, inspect };
}

  let meta = '', acts = '';
  if (mode === 'due') {
    meta = `<span class="mono">${b.no}</span><span>·</span><span>${fMob(c.mobile)}</span><span class="deadline" style="padding:3px 8px;font-size:12px">${ic('clock', 13)} Return before ${fTime(b.returnBy)}</span>`;
    acts = `${callBtn(c, b.no)}${waBtn(b.no, 'reminder')}<button class="btn btn-sm" onclick="go('#/booking/${b.no}')">Open</button><button class="btn btn-sm btn-primary" onclick="go('#/return/${b.no}')">${ic('ret', 16)} Mark Returned</button>`;
  } else if (mode === 'done') {
    const at = b.receivedAt || (b.returnInfo && b.returnInfo.receivedAt);
    meta = `<span class="mono">${b.no}</span><span>·</span><span style="color:var(--good);font-weight:700">${ic('check', 13, 3)} Returned ${at ? fTime(at) : ''}</span>${b.status === 'returned_pending' ? '<span class="pill st-inspection">Inspection pending</span>' : ''}`;
    acts = b.status === 'returned_pending' ? `<button class="btn btn-sm btn-soft" onclick="go('#/return/${b.no}')">${ic('eye', 16)} Inspect</button>` : `<button class="btn btn-sm btn-ghost" onclick="go('#/booking/${b.no}')">View</button>`;
  } else if (mode === 'over') {
    const lf = lateFee(b.returnBy, NOW);
    meta = `<span class="mono">${b.no}</span><span>·</span><span>${fMob(c.mobile)}</span><span>·</span><span>Due before ${fTime(b.returnBy)}${sameDay(b.returnBy, NOW) ? '' : ' on ' + fDateS(b.returnBy)}</span><span>·</span><span>Now ${fTime(NOW)}</span>
      <span class="pill st-lost"><b>${minsTxt(lf.mins)} late</b></span><span class="pill st-lost">${lf.grace ? 'In grace period' : 'Late fee ' + rs(lf.fee)}</span>`;
    acts = `${callBtn(c, b.no).replace('btn-sm', 'btn-sm btn-danger')}${waBtn(b.no, 'overdue')}${b.lateFlag ? `<span class="pill st-lost">${ic('check', 13, 3)} Late fee added</span>` : `<button class="btn btn-sm btn-danger-soft" onclick="addLateFee('${b.no}')">+ Add Late Fee</button>`}<button class="btn btn-sm btn-primary" onclick="go('#/return/${b.no}')">Process Return</button>`;
  } else if (mode === 'pickup') {
    const done = b.status !== 'reserved';
    meta = `<span class="mono">${b.no}</span><span>·</span><span>${fMob(c.mobile)}</span>${done ? `<span style="color:var(--good);font-weight:700">${ic('check', 13, 3)} Picked up ${b.pickedAt ? fTime(b.pickedAt) : ''}</span>` : m.outstanding ? `<span class="pill st-inspection">Collect ${rs(m.outstanding)}</span>` : `<span class="pill st-available">Fully paid</span>`}`;
    acts = done ? `<button class="btn btn-sm btn-ghost" onclick="go('#/booking/${b.no}')">View</button>` : `${callBtn(c, b.no)}${waBtn(b.no, 'pickup')}<button class="btn btn-sm btn-primary" onclick="handoverModal('${b.no}')">${ic('bag', 16)} Hand Over</button>`;
  }
  return `<div class="drow ${mode === 'done' || (mode === 'pickup' && b.status !== 'reserved') ? 'done' : ''} ${mode === 'over' ? 'over' : ''}">
    <div class="row at"><div class="avatar" ${mode === 'over' ? 'style="background:var(--danger-soft);color:var(--danger)"' : ''}>${initials(c.name)}</div>

function doHandover(no) {

function ledgerDay(day) {
  const t0 = sod(day), t1 = addDays(t0, 1), rows = [];
  DB.bookings.forEach(b => b.payments.forEach(p => { if (p.at >= t0 && p.at < t1) rows.push({ ...p, b }); }));
  DB.sales.filter(s => !s.voided).forEach(s => { if (s.at >= t0 && s.at < t1) rows.push({ kind: 'sale', amount: s.price, mode: s.mode, at: s.at, s }); });
  return rows;
}

function invFiltered() {
  const q = INV.q.trim().toLowerCase();
  let list = DB.items.map(it => ({ it, st: istate(it) }));
  if (INV.codes) list = list.filter(x => INV.codes.includes(x.it.code));
  if (INV.type !== 'all') list = list.filter(x => x.it.type === INV.type);
  if (INV.st !== 'all') list = list.filter(x => x.st === INV.st);
  if (INV.size !== 'all') list = list.filter(x => x.it.size === INV.size);
  if (q) list = list.filter(x => [x.it.code, x.it.name, x.it.colour, x.it.style, x.it.size, TYPES[x.it.type].name].join(' ').toLowerCase().includes(q));
  if (INV.free) { const dts = datesForEvent(parseIso(INV.free)); list = list.filter(x => availability(x.it.code, dts.pickupAt, dts.returnBy).ok); }
  return list;
}

function tagCard(it) {

async function fillQRs(root) {
  try {
    await loadQRGen();
    root.querySelectorAll('[data-qr]').forEach(el => {
      const q = window.qrcode(0, 'M'); q.addData(el.getAttribute('data-qr')); q.make();
      el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    });

}
/* QR tag as a PNG image: QR + item code + name, ready to print or share */
async function tagPNG(it) {
  await loadQRGen();
  const q = window.qrcode(0, 'M'); q.addData(tagText(it.code)); q.make();
  const n = q.getModuleCount(), W = 600, cell = Math.floor(520 / (n + 4)), qs = cell * n, top = 70;
  const H = top + qs + cell * 4 + 150;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.fillStyle = '#7a1f4b'; x.font = '700 26px system-ui, Arial, sans-serif'; x.fillText('OMG RENTAL', W / 2, 48);
  const ox = Math.round((W - qs) / 2), oy = top + cell * 2;
  x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(ox + k * cell, oy + r * cell, cell, cell);
  let y = oy + qs + cell * 2 + 62;
  x.fillStyle = '#111'; x.font = '800 60px ui-monospace, Consolas, monospace'; x.fillText(it.code, W / 2, y);
  const fit = (t, max) => { t = String(t || ''); if (x.measureText(t).width <= max) return t; while (t && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; };
  y += 40; x.fillStyle = '#333'; x.font = '600 26px system-ui, Arial, sans-serif'; x.fillText(fit(it.name, W - 40), W / 2, y);
  const sub = [it.size, it.deposit ? 'Deposit ' + rs(it.deposit) : ''].filter(Boolean).join(' · ');
  if (sub) { y += 34; x.fillStyle = '#777'; x.font = '22px system-ui, Arial, sans-serif'; x.fillText(fit(sub, W - 40), W / 2, y); }
  x.strokeStyle = '#ccc'; x.setLineDash([10, 8]); x.lineWidth = 2; x.strokeRect(1, 1, W - 2, H - 2);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
function saveBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function downloadTag(code) {
  const it = item(code); if (!it) return;
  try { saveBlob(await tagPNG(it), 'QR-' + it.code + '.png'); toast('QR-' + it.code + '.png downloaded', 'good'); }
  catch (e) { toast('Could not make the QR — check internet', 'bad'); }
}
async function downloadTags(codes) {
  const btn = $('#dlTagsBtn'); if (btn) btn.disabled = true;
  let n = 0;
  for (const code of codes) {
    const it = item(code); if (!it) continue;
    try { saveBlob(await tagPNG(it), 'QR-' + it.code + '.png'); n++; } catch (e) { toast('Could not make the QR — check internet', 'bad'); break; }
    if (btn) btn.textContent = 'Downloading ' + n + ' / ' + codes.length + '…';
    await new Promise(r => setTimeout(r, 350));
  }
  closeModal(); toast(n + ' QR image' + (n === 1 ? '' : 's') + ' downloaded', 'good');
}

let W = null;

}

const wDeposit = q => W.depOverride != null ? W.depOverride : q.deposit;
const wDueNow = q => q.rentNet + (W.depTiming === 'now' ? wDeposit(q) : 0);
const wPay = q => W.payAmt != null ? W.payAmt : wDueNow(q);
const wAvail = l => availability(l.code, W.pickupAt, W.returnBy);
const wBlocked = () => W.lines.filter(l => !wAvail(l).ok);
function scrWizard() {
  if (!W) newWizard();
  const steps = ['Customer', 'Items & Dates', 'Payment', 'Review'];
  const body = [wizStep1, wizStep2, wizStep3, wizStep4][W.step - 1]();
  return {
    t: 'New Rental', s: `Step ${W.step} of 4 · ${steps[W.step - 1]}`, html: `
    <div class="pagehead"><div class="grow"><div class="eyebrow">New booking</div><h1 class="pg">New Rental</h1></div><button class="btn btn-ghost" onclick="if(confirm('Discard this booking?')){W=null;go('#/dashboard')}">${ic('x', 18)} Discard</button></div>
    <div class="stepper">${steps.map((s, i) => `<button class="st ${W.step === i + 1 ? 'on' : W.step > i + 1 ? 'done' : ''}" onclick="wizGoto(${i + 1})"><i>${W.step > i + 1 ? ic('check', 14, 3) : i + 1}</i>${s}</button>`).join('')}</div>

}
function wizAfter() {

function wizCanGo(n) {

function setEvent(iso) { const d = datesForEvent(parseIso(iso)); Object.assign(W, d); W.custom = false; W.payAmt = null; render(); }

function wizCart() {

function wizAdd(code) { const a = availability(code, W.pickupAt, W.returnBy); if (!a.ok) { toast(`${code}: ${a.reason}`, 'bad'); return; } W.lines.push({ code, pkg: null }); W.payAmt = null; W.iq = ''; const q = $('#wiq'); if (q) { q.value = ''; q.focus(); } wizTourCheck(); wizRefresh(); toast(`${code} added`, 'good'); }
function wizRemove(i) { const l = W.lines[i]; W.lines.splice(i, 1); if (l.pkg != null && !W.lines.some(x => x.pkg === l.pkg)) wizRemovePkg(l.pkg, true); W.payAmt = null; wizRefresh(); }
function wizRemovePkg(pi, silent) { W.lines = W.lines.filter(l => l.pkg !== pi).map(l => ({ ...l, pkg: l.pkg != null && l.pkg > pi ? l.pkg - 1 : l.pkg })); W.pkgs.splice(pi, 1); W.payAmt = null; if (!silent) wizRefresh(); }
function wizSwap(i, code) { if (!code) return; W.lines[i].code = code; W.payAmt = null; wizRefresh(); }
function wizAddPkg(key) {
  const p = DB.packages.find(x => x.key === key), pi = W.pkgs.length, used = new Set(W.lines.map(l => l.code));
  const picks = []; let colour = null;
  const slots = [...p.slots];
  const free = t => DB.items.filter(it => it.type === t && it.mode !== 'sale' && !used.has(it.code) && availability(it.code, W.pickupAt, W.returnBy).ok);
  // no separate Ghagra or Choli free: one GC (Ghagra-Choli) set fills both slots
  if (slots.includes('G') && slots.includes('C') && (!free('G').length || !free('C').length) && free('GC').length) { slots.splice(slots.indexOf('G'), 1, 'GC'); slots.splice(slots.indexOf('C'), 1); }
  for (let si = 0; si < slots.length; si++) {
    const t = slots[si];
    const cands = free(t);

    if (!best) { toast(`No ${TYPES[t].short} free for these dates`, 'bad'); return; }
    if (t === 'G' || t === 'GC') colour = best.colour; used.add(best.code); picks.push(best.code);
  }
  W.pkgs.push({ key: p.key, name: p.name, price: p.price }); picks.forEach(c => W.lines.push({ code: c, pkg: pi })); W.payAmt = null;
  wizRefresh(); toast(`${p.name} added — ${picks.join(' + ')}. Swap any piece below.`, 'good');
}

function wizOffer(v) {
  const gross = quote({ lines: W.lines, pkgs: W.pkgs, pickupAt: W.pickupAt, returnBy: W.returnBy }).gross;
  if (v === '' || v == null) { W.offer = null; W.payAmt = null; return render(); }
  const n = Math.round(+v);
  if (!(n >= 0)) return toast('Enter a valid amount', 'bad');
  if (n >= gross) { W.offer = null; W.payAmt = null; toast(`${rs(n)} is not below the list price ${rs(gross)} — no discount`); return render(); }
  const pct = Math.round((gross - n) / gross * 1000) / 10;
  const apply = () => { W.offer = n; W.voucher = null; W.vok = false; W.vmsg = ''; W.payAmt = null; render(); };
  if (pct > (+S().staffMaxDiscountPct || 0)) return guard('fee.waive', `Give ${pct}% discount (offer ${rs(n)} on ${rs(gross)})`, apply);
  apply();
}
function wizVoucher() {

  W.voucher = r.ok ? code : null; W.vok = r.ok; W.vmsg = r.msg; W.payAmt = null;
  if (r.ok && code === 'OMG100') tourMark('voucher');

}

    t: `Return · ${b.no}`, s: c.name, html: `
    <div class="pagehead"><div class="grow"><div class="eyebrow">Process return</div><h1 class="pg">${esc(c.name)} <span class="mono muted" style="font-family:inherit;font-size:18px">${b.no}</span></h1><p>${fMob(c.mobile)} · ${b.lines.length} pieces · picked up ${b.pickedAt ? fDT(b.pickedAt) : '—'}</p></div><button class="btn" onclick="go('#/booking/${no}')">Open booking</button></div>
    <div class="split"><div class="stack s16">${timing}
      <div class="card"><div class="card-h">${ic('eye', 20)}<h3 class="grow">Check every piece</h3><button class="btn btn-sm btn-soft" onclick="Object.keys(RET.lines).forEach(k=>{RET.lines[k].cond='good';RET.lines[k].charge=0});render()">All good</button></div>
        ${b.lines.map(l => { const it = item(l.code), rl = RET.lines[l.code], cd = CONDS.find(c => c.k === rl.cond); return `<div class="retitem"><div class="row">${thumb(it)}<div class="grow"><span class="code">${it.code}</span> <b>${esc(it.name)}</b><div class="tiny muted">${esc(it.size)} · deposit ${rs(it.deposit)}${it.notes ? ' · ' + esc(it.notes) : ''}</div></div>
          <span class="pill ${cd.next === 'in' ? 'st-available' : cd.next === 'repair' ? 'st-repair' : 'st-lost'}">→ ${NEXT_LABEL[cd.next]}</span></div>
          ${miniPhotos(l.code, b.no)}<div class="cond">${CONDS.map(k => `<button class="${k.cls} ${rl.cond === k.k ? 'on' : ''}" onclick="retCond('${l.code}','${k.k}')">${k.label}</button>`).join('')}</div>
          ${rl.cond !== 'good' ? `<div class="row wrap"><div class="field" style="width:170px"><label>Charge</label><div class="input-wrap"><span class="pre">₹</span><input class="input" type="number" inputmode="numeric" value="${rl.charge}" oninput="retCharge('${l.code}',this.value)"></div></div><div class="field grow"><label>Note / photo</label><div class="row"><input class="input" placeholder="What happened?" value="${esc(rl.note)}" onchange="RET.lines['${l.code}'].note=this.value"><label class="btn icon-btn upbtn" title="Add damage photo" aria-label="Add damage photo">${ic('scan', 18)}<input type="file" accept="image/*" multiple onchange="addPhotos(this,'${l.code}','damage','${b.no}')"></label></div></div></div>` : ''}</div>`; }).join('')}
      </div></div>
