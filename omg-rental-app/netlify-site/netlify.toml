[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; connect-src https://script.google.com https://script.googleusercontent.com; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
